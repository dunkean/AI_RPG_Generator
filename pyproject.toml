[project]
name = "ttrpg-content-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.68",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "pynames>=0.2",
    "shortuuid>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "httpx>=0.25",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1"]

[project.scripts]
ttrpg-generate = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
